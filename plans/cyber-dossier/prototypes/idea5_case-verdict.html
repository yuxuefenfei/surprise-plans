<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea 5 - Case Verdict</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: linear-gradient(135deg, #050809, #07191a); color: #d9fff8; font-family: Consolas, monospace; }
        .report { width: min(760px, calc(100vw - 28px)); border: 1px solid rgba(255,209,102,.5); padding: 28px; background: rgba(8,24,26,.94); box-shadow: 0 0 36px rgba(255,209,102,.12); }
        h1 { color: #ffd166; }
        .line { min-height: 1.7em; color: #18ffd6; }
        button { border: 1px solid #ffd166; background: rgba(255,209,102,.08); color: #ffd166; padding: 12px 16px; font: 1rem Consolas, monospace; cursor: pointer; }
    </style>
</head>
<body>
    <section class="report">
        <h1>CASE CLOSED</h1>
        <button id="print">print verdict</button>
        <div id="lines"></div>
    </section>
    <script>
        const lines = ["调查结论：目标不是异常。", "异常的是调查员总会注意到她。", "建议：把这份特别正式归档。"];
        document.getElementById("print").addEventListener("click", () => {
            document.getElementById("lines").innerHTML = lines.map(line => `<p class="line">> ${line}</p>`).join("");
        });
    </script>
</body>
</html>
