<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idea 1 - Terminal Boot</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #18ffd6; background: #050809; font-family: Consolas, monospace; }
        body::before { content: ""; position: fixed; inset: 0; background: linear-gradient(transparent 50%, rgba(0,0,0,.28) 50%); background-size: 100% 4px; pointer-events: none; }
        .terminal { width: min(860px, calc(100vw - 28px)); border: 1px solid rgba(24,255,214,.35); padding: 28px; box-shadow: 0 0 36px rgba(24,255,214,.18); background: rgba(5,18,20,.94); }
        h1 { margin: 0 0 22px; font-size: clamp(2rem, 8vw, 5rem); text-shadow: 0 0 22px rgba(24,255,214,.5); }
        .line { display: block; min-height: 1.6em; opacity: 0; animation: reveal .3s forwards; }
        .line:nth-child(2) { animation-delay: .4s; } .line:nth-child(3) { animation-delay: .9s; } .line:nth-child(4) { animation-delay: 1.4s; } .line:nth-child(5) { animation-delay: 1.9s; color: #ffd166; }
        @keyframes reveal { to { opacity: 1; } }
        .cursor { display: inline-block; width: 10px; height: 1.1em; background: #18ffd6; animation: blink 1s step-end infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; opacity: 1 !important; } }
    </style>
</head>
<body>
    <section class="terminal">
        <h1>BOOT</h1>
        <span class="line">> loading cold case interface</span>
        <span class="line">> checking investigator patience</span>
        <span class="line">> patience: acceptable</span>
        <span class="line">> access granted <span class="cursor"></span></span>
    </section>
</body>
</html>
