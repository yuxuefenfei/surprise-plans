<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050809">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='none' stroke='%2318ffd6' stroke-width='3' d='M16 3 29 16 16 29 3 16Z'/%3E%3Cpath stroke='%23ffd166' stroke-width='2' d='M10 16h12'/%3E%3C/svg%3E">
    <title>机密档案 · 赛博侦探</title>
    <link rel="stylesheet" href="../assets/dossier.css">
    <script src="../assets/dossier-config.js" defer></script>
    <script src="../assets/dossier-nav.js" defer></script>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand"><span class="brand-mark"></span><span>赛博侦探</span></div>
            <div class="status">加密信道 · 在线</div>
        </header>
        <section class="hero">
            <div class="panel">
                <p class="eyebrow">案件编号 <span id="caseId"></span></p>
                <h1 id="headline"></h1>
                <p id="intro"></p>
                <p id="subIntro"></p>
                <div class="btn-row">
                    <a class="btn" id="enterBtn" href="./01-briefing.html"></a>
                    <button class="btn secondary" id="rerunBoot" type="button">重放启动日志</button>
                </div>
            </div>
            <aside class="terminal" id="bootTerminal" aria-live="polite">
                <div class="terminal-header">
                    <span class="terminal-title">SYSTEM BOOT</span>
                    <span class="terminal-dots"><span></span><span></span><span></span></span>
                </div>
            </aside>
        </section>
        <nav class="nav">
            <span class="tag">无需密码 · 但需要真诚</span>
            <a class="btn" href="./01-briefing.html" id="nextLabel"></a>
        </nav>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById("caseId").textContent = CONFIG.caseId;
            document.getElementById("headline").textContent = CONFIG.headline;
            document.getElementById("intro").textContent = CONFIG.intro;
            document.getElementById("subIntro").textContent = CONFIG.subIntro;
            document.getElementById("enterBtn").textContent = CONFIG.enterLabel;
            document.getElementById("nextLabel").textContent = CONFIG.nextLabel;

            const aliasSpan = document.createElement("span");
            aliasSpan.id = "alias";
            aliasSpan.textContent = CONFIG.targetAlias;

            const terminal = document.getElementById("bootTerminal");
            CONFIG.bootLines.forEach((line, index) => {
                const span = document.createElement("span");
                span.className = line.className;
                if (index === 1) {
                    span.appendChild(document.createTextNode("> 加载目标代号："));
                    span.appendChild(aliasSpan);
                } else {
                    span.textContent = line.text;
                }
                span.style.animationDelay = `${index * 0.4}s`;
                terminal.appendChild(span);
            });

            const cursor = document.createElement("span");
            cursor.className = "cursor";
            terminal.appendChild(cursor);

            document.getElementById("rerunBoot").addEventListener("click", () => location.reload());
        });
    </script>
</body>
</html>
