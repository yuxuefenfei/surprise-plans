<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050809">
    <title>Cyber Dossier - Evidence Board</title>
    <link rel="stylesheet" href="../assets/dossier.css">
    <script src="../assets/dossier-config.js"></script>
    <script>
        const CONFIG = {
            ...DOSSIER_CONFIG,
            ...DOSSIER_CONFIG.pages.evidence,
            stage: 2,
        };
    </script>
    <script src="../assets/dossier-nav.js" defer></script>
</head>
<body>
    <main class="shell">
        <header class="topbar">
            <div class="brand"><span class="brand-mark"></span><span>Evidence Board</span></div>
            <div class="status">CLICK ALL CLUES</div>
        </header>
        <section class="panel">
            <p class="eyebrow">evidence analysis</p>
            <h1>TRACE MAP</h1>
            <p>点击证据卡，系统会把可疑细节加入案卷。全部读取后，才能截获下一段信号。</p>
        </section>
        <section class="grid" id="board"></section>
        <section class="panel">
            <div class="progress"><span id="bar"></span></div>
            <p class="notice" id="notice">0/6 条线索已读取。</p>
            <div class="btn-row">
                <a class="btn secondary" href="./01-briefing.html">返回简报</a>
                <a class="btn hidden" id="next" href="./03-intercept.html">截获信号</a>
            </div>
        </section>
    </main>
    <script>
        const board = document.getElementById("board");
        const opened = new Set();
        CONFIG.clues.forEach(([code, title, detail], index) => {
            const card = document.createElement("button");
            card.className = "card";
            card.type = "button";
            card.innerHTML = `<span class="tag">${code}</span><h3>${title}</h3><p>权限锁定。点击读取。</p>`;
            card.addEventListener("click", () => {
                opened.add(index);
                card.innerHTML = `<span class="tag">${code}</span><h3>${title}</h3><p>${detail}</p>`;
                card.style.background = "rgba(8, 30, 32, 0.98)";
                document.getElementById("bar").style.setProperty("--value", `${opened.size / CONFIG.clues.length * 100}%`);
                document.getElementById("notice").textContent = opened.size === CONFIG.clues.length ? "证据墙闭环完成。下一步：监听异常信号。" : `${opened.size}/6 条线索已读取。`;
                document.getElementById("next").classList.toggle("hidden", opened.size !== CONFIG.clues.length);
            });
            board.appendChild(card);
        });
    </script>
</body>
</html>
