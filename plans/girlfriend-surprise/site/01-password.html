<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0610">
    <title>给你的秘密宇宙 · 解锁入口</title>
    <style>
        :root {
            --c-bg-deep:    #0d0610;
            --c-rose:       #ff3d6a;
            --c-rose-dark:  #ea0037;
            --c-rose-light: #ff7a9e;
            --c-text:       #fff0f5;
            --c-text-dim:   rgba(255, 220, 234, 0.78);
            --c-glass:      rgba(255, 255, 255, 0.055);
            --c-border:     rgba(255, 255, 255, 0.12);
            --radius-card:  22px;
            --radius-pill:  999px;
            --font-main:    'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --heart-size:   clamp(80px, 18vw, 108px);
            --heart-drop:   clamp(88px, 14vh, 150px);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            margin: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(255, 61, 106, 0.14) 0%, transparent 55%),
                radial-gradient(ellipse at 20% 100%, rgba(180, 30, 80, 0.1) 0%, transparent 45%),
                linear-gradient(160deg, var(--c-bg-deep) 0%, #190b24 55%, #0a0412 100%);
            overflow: hidden;
            font-family: var(--font-main);
            color: var(--c-text);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100svh;
            padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
            transition: background 1.6s ease;
            animation: pageIn 0.6s ease both;
        }

        @keyframes pageIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        body.unlocked {
            background:
                radial-gradient(ellipse at 50% 40%, rgba(255, 61, 106, 0.22) 0%, transparent 60%),
                radial-gradient(ellipse at 30% 100%, rgba(140, 10, 50, 0.18) 0%, transparent 40%),
                linear-gradient(160deg, #1a0010 0%, #0e0018 60%, #050008 100%);
        }

        /* ── 心形 ── */
        .heart-stage {
            width: calc(var(--heart-size) * 1.9);
            height: calc(var(--heart-size) * 1.9);
            margin: 0 auto 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 3.2s cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
            position: relative;
            z-index: 2;
        }

        .heart {
            position: relative;
            width: var(--heart-size);
            height: var(--heart-size);
            background: linear-gradient(135deg, #484848 0%, #3a3a3a 55%, #2e2e2e 100%);
            transform: rotate(-45deg);
            transition: background 1.8s ease, box-shadow 1.8s ease;
            box-shadow: 0 0 12px rgba(30, 30, 30, 0.8);
            will-change: background, box-shadow;
        }

        .heart::before, .heart::after {
            content: '';
            position: absolute;
            width: var(--heart-size);
            height: var(--heart-size);
            background: inherit;
            border-radius: 50%;
        }
        .heart::before { top: calc(var(--heart-size) * -0.5); left: 0; }
        .heart::after  { top: 0; left: calc(var(--heart-size) * 0.5); }

        /* 解锁时光晕环 */
        .heart-halo {
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 61, 106, 0.18) 0%, transparent 70%);
            opacity: 0;
            transition: opacity 1.5s ease;
            pointer-events: none;
        }

        body.unlocked .heart-stage {
            transform: translateY(20px);
        }
        body.unlocked .heart-halo {
            opacity: 1;
        }
        body.unlocked .heart {
            background: linear-gradient(135deg, #ff7090 0%, #ff3d6a 45%, #ea0037 100%);
            box-shadow:
                0 0 0 rgba(255,61,106,0),
                0 0 28px rgba(255, 61, 106, 0.75),
                0 0 72px rgba(234, 0, 55, 0.5);
        }
        body.unlocked.heart-beating .heart {
            animation: heartbeat 1.85s ease-in-out infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: rotate(-45deg) scale(1); }
            30%       { transform: rotate(-45deg) scale(1.06); }
            60%       { transform: rotate(-45deg) scale(1.11); }
        }

        /* ── 容器 ── */
        .container {
            position: relative;
            text-align: center;
            z-index: 10;
            width: min(92vw, 560px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .intro {
            margin: 0 0 20px;
            color: var(--c-text-dim);
            font-size: 0.97rem;
            line-height: 1.95;
            transition: transform 2s ease, opacity 2s ease;
        }
        
        body.unlocked .intro {
            transform: translateY(-30px);
        }

        .message-slot {
            position: relative;
            width: 100%;
            min-height: 260px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        /* ── 输入区 ── */
        .input-group {
            background: rgba(255,255,255,0.045);
            padding: 32px 28px;
            border-radius: var(--radius-card);
            border: 1px solid var(--c-border);
            transition: opacity 0.9s ease, transform 0.9s ease;
            position: relative;
            width: 100%;
            z-index: 1;
        }

        .input-group p {
            margin: 0 0 18px;
            color: rgba(255, 220, 233, 0.9);
            line-height: 1.85;
            font-size: 0.97rem;
        }

        input[type="text"] {
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255,255,255,0.22);
            color: var(--c-text);
            font-size: 1.1rem;
            font-family: var(--font-main);
            text-align: center;
            padding: 10px 4px;
            width: min(280px, 100%);
            outline: none;
            transition: border-color 0.25s ease;
            caret-color: var(--c-rose);
        }

        input[type="text"]:focus {
            border-bottom-color: var(--c-rose);
        }

        .msg {
            margin-top: 16px;
            font-size: 0.9rem;
            color: rgba(160,160,160,0.9);
            min-height: 22px;
            transition: color 0.25s ease;
        }

        /* ── 解锁欢迎语 ── */
        .welcome-msg {
            display: none;
            font-size: clamp(1.7rem, 5.5vw, 2.4rem);
            color: var(--c-rose-light);
            font-weight: 300;
            letter-spacing: 0.15rem;
            line-height: 1.65;
            opacity: 0;
            animation: fadeIn 2s forwards 0.5s;
            position: absolute;
            inset: 0;
            align-items: flex-start;
            justify-content: center;
            text-align: center;
            padding-top: clamp(60px, 10vh, 120px);
            z-index: 3;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        /* ── info-btn 统一样式 ── */
        .info-btn {
            position: fixed;
            top: max(16px, env(safe-area-inset-top, 0px));
            right: 20px;
            z-index: 100;
            border: 1px solid rgba(255, 255, 255, 0.22);
            padding: 8px 18px;
            border-radius: var(--radius-pill);
            cursor: pointer;
            color: rgba(255,220,234,0.9);
            font-family: var(--font-main);
            font-size: 0.85rem;
            background: rgba(14, 8, 22, 0.72);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: background 0.22s ease, border-color 0.22s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .info-btn:hover {
            background: rgba(255, 61, 106, 0.14);
            border-color: rgba(255, 120, 155, 0.38);
        }

        /* ── Modal 统一样式 ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(5, 2, 10, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.is-open {
            display: flex;
        }

        .modal {
            background: rgba(18, 8, 28, 0.97);
            border: 1px solid rgba(255, 61, 106, 0.35);
            padding: 32px 28px;
            border-radius: var(--radius-card);
            z-index: 201;
            text-align: center;
            width: min(calc(100vw - 40px), 360px);
            box-shadow:
                0 0 0 1px rgba(255, 61, 106, 0.08),
                0 20px 50px rgba(0, 0, 0, 0.5),
                0 0 40px rgba(255, 61, 106, 0.12);
        }

        .modal h2 {
            margin: 0 0 14px;
            color: var(--c-rose-light);
            font-size: 1.15rem;
            font-weight: 500;
            letter-spacing: 0.06rem;
        }

        .modal p {
            line-height: 1.9;
            color: rgba(255, 236, 244, 0.86);
            font-size: 0.95rem;
            margin: 0;
        }

        .close-btn {
            margin-top: 22px;
            padding: 9px 28px;
            background: linear-gradient(135deg, var(--c-rose), var(--c-rose-dark));
            border: none;
            color: white;
            font-family: var(--font-main);
            font-size: 0.9rem;
            border-radius: var(--radius-pill);
            cursor: pointer;
            transition: opacity 0.2s ease, transform 0.2s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .close-btn:hover { opacity: 0.88; transform: translateY(-1px); }
        .close-btn:active { transform: translateY(0); }

        /* ── 底部导航 ── */
        .nav {
            position: fixed;
            left: 50%;
            bottom: max(20px, env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            z-index: 50;
            width: min(92vw, 600px);
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
            padding: 12px 20px;
            border-radius: var(--radius-pill);
            text-decoration: none;
            border: 1px solid var(--c-border);
            color: rgba(255,220,234,0.88);
            font-family: var(--font-main);
            font-size: 0.9rem;
            background: rgba(14, 8, 22, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: opacity 0.28s ease, transform 0.28s ease, background 0.28s ease, border-color 0.28s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .nav-link:hover {
            background: rgba(255, 61, 106, 0.1);
            border-color: rgba(255, 100, 140, 0.3);
            transform: translateY(-1px);
        }
        .nav-link:active { transform: translateY(0); }

        .nav-link.primary {
            border-color: rgba(255, 90, 130, 0.55);
            background: rgba(255, 61, 106, 0.16);
            color: #fff;
        }
        .nav-link.primary:hover {
            background: rgba(255, 61, 106, 0.26);
            border-color: rgba(255, 120, 155, 0.7);
        }

        .nav-link.is-hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(8px);
        }
        .nav-link.is-visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        /* ── 响应式 ── */
        @media (max-width: 520px) {
            body { padding: 20px 16px calc(120px + env(safe-area-inset-bottom, 0px)); }
            .heart-stage { margin-bottom: 28px; }
            .message-slot { min-height: 180px; }
            .welcome-msg {
                padding-top: clamp(40px, 8vh, 100px);
                letter-spacing: 0.06rem;
            }
            .input-group { padding: 26px 18px; }
            .nav-link { width: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            body { animation: none; }
            .heart, body.unlocked.heart-beating .heart { animation: none; }
        }
    </style>
</head>
<body>
    <button class="info-btn" id="openModal" aria-haspopup="dialog" aria-controls="modal">寓意</button>

    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc" tabindex="-1">
        <div class="modal" id="modal">
            <h2 id="modalTitle"></h2>
            <p id="modalDesc"></p>
            <button class="close-btn" id="closeModal">关闭</button>
        </div>
    </div>

    <div class="container">
        <p class="intro" id="introText"></p>
        <div class="heart-stage" id="heartStage">
            <div class="heart-halo" aria-hidden="true"></div>
            <div class="heart" id="heart"></div>
        </div>
        <div class="message-slot">
            <div class="input-group" id="inputGroup">
                <p id="passHint"></p>
                <input type="text" id="pwd" autocomplete="off" inputmode="text">
                <div class="msg" id="msg"></div>
            </div>
            <div class="welcome-msg" id="welcomeMsg"></div>
        </div>
    </div>

    <nav class="nav" aria-label="页面导航">
        <a class="nav-link" href="./index.html">回到开场</a>
        <a class="nav-link primary is-hidden" id="nextLink" href="./02-timeline.html" tabindex="-1"></a>
    </nav>

    <script>
        const CONFIG = {
            pageTitle:       '给你的秘密宇宙 · 解锁入口',
            modalTitle:      '你一直是我的答案',
            modalDesc:       '有些人不是一下子闯进心里，而是在一次次说话、一次次分享、一次次惦记里，慢慢变成了最重要的那一个。',
            introText:       '宝，先替我解开这一道小小的题吧。答案其实很简单，是我早就习惯放在心上的那个人。',
            passwords:       ['[姓名]', '[拼音]', '[拼音变体]', '[单字昵称]', '[生日简写]', '[生日8位数字]', '[生日斜杠格式]', '[专属称呼]'],
            passHint:        '输入那个让我总想分享日常的答案',
            inputPlaceholder:'把答案轻轻留在这里',
            waitingMessage:  '我在这里，等你把它轻轻说出来...',
            errorMessage:    '再想一想，是那个让我越来越离不开的名字',
            welcomeMessage:  '欢迎来到我想慢慢讲给你的世界，[姓名]',
            nextLabel:       '去看看被时间留下的心意 →'
        };

        const HEART_SINK_DURATION_MS = 3200;

        document.title                                   = CONFIG.pageTitle;
        document.getElementById('modalTitle').innerText  = CONFIG.modalTitle;
        document.getElementById('modalDesc').innerText   = CONFIG.modalDesc;
        document.getElementById('introText').innerText   = CONFIG.introText;
        document.getElementById('passHint').innerText    = CONFIG.passHint;
        document.getElementById('welcomeMsg').innerText  = CONFIG.welcomeMessage;
        document.getElementById('nextLink').innerText    = CONFIG.nextLabel;

        const pwdInput      = document.getElementById('pwd');
        const msg           = document.getElementById('msg');
        const nextLink      = document.getElementById('nextLink');
        const modalOverlay  = document.getElementById('modalOverlay');
        const openModalBtn  = document.getElementById('openModal');
        const closeModalBtn = document.getElementById('closeModal');
        let unlocked = false;
        let lastFocused = null;

        pwdInput.placeholder   = CONFIG.inputPlaceholder;
        msg.textContent        = CONFIG.waitingMessage;

        function openModal() {
            lastFocused = document.activeElement;
            modalOverlay.classList.add('is-open');
            closeModalBtn.focus();
        }

        function closeModal() {
            modalOverlay.classList.remove('is-open');
            (lastFocused instanceof HTMLElement ? lastFocused : openModalBtn).focus();
        }

        openModalBtn.addEventListener('click', openModal);
        closeModalBtn.addEventListener('click', closeModal);
        modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOverlay.classList.contains('is-open')) closeModal(); });

        pwdInput.addEventListener('input', e => {
            if (unlocked) return;
            const val = e.target.value.trim();
            if (CONFIG.passwords.includes(val)) {
                unlock();
            } else if (val.length > 0) {
                msg.textContent = CONFIG.errorMessage;
                msg.style.color = 'rgba(255,130,150,0.9)';
            } else {
                msg.textContent = CONFIG.waitingMessage;
                msg.style.color = '';
            }
        });

        function unlock() {
            if (unlocked) return;
            unlocked = true;
            document.body.classList.add('unlocked');
            pwdInput.disabled = true;
            msg.textContent   = '';

            const inputGroup = document.getElementById('inputGroup');
            inputGroup.style.opacity   = '0';
            inputGroup.style.transform = 'translateY(6px)';

            nextLink.classList.remove('is-hidden');

            setTimeout(() => {
                document.body.classList.add('heart-beating');
                inputGroup.style.visibility = 'hidden';
                const welcome = document.getElementById('welcomeMsg');
                welcome.style.display = 'flex';
                createSparks();
                nextLink.tabIndex = 0;
                nextLink.classList.add('is-visible');
                nextLink.focus();
            }, HEART_SINK_DURATION_MS);
        }

        function createSparks() {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const fragment  = document.createDocumentFragment();
            const count     = 28;
            for (let i = 0; i < count; i++) {
                const spark  = document.createElement('div');
                const angle  = Math.random() * Math.PI * 2;
                const dist   = 80 + Math.random() * 260;
                const tx     = Math.cos(angle) * dist;
                const ty     = Math.sin(angle) * dist;
                const size   = 3 + Math.random() * 3;

                Object.assign(spark.style, {
                    position: 'fixed', width: size + 'px', height: size + 'px',
                    background: i % 3 === 0 ? '#ff7a9e' : (i % 3 === 1 ? '#ff3d6a' : '#fff'),
                    borderRadius: '50%', top: '50%', left: '50%',
                    boxShadow: '0 0 8px #ff3d6a', willChange: 'transform, opacity', pointerEvents: 'none'
                });

                spark.animate([
                    { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 },
                    { transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0)`, opacity: 0 }
                ], { duration: 1200 + Math.random() * 900, easing: 'cubic-bezier(0, 0.9, 0.57, 1)', fill: 'forwards' })
                    .finished.then(() => spark.remove());

                fragment.appendChild(spark);
            }
            document.body.appendChild(fragment);
        }
    </script>
</body>
</html>
